# cargo-deny configuration. Run `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# The workspace is AGPL-3.0-or-later. Dependencies must be licensed
# permissively enough to combine with it.
allow = [
    # The workspace crates and hashsigs-rs carry this. Without it every
    # first-party crate is rejected for its own license.
    "AGPL-3.0-or-later",
    "Apache-2.0",
    # target-lexicon, a build-time dependency of the WebAssembly toolchain.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Intra-workspace `{ path = ... }` dependencies carry no version and read as
# wildcards. They are not a supply-chain risk: they resolve inside this repo.
allow-wildcard-paths = true
# One rand_core major version across the graph. Two would mean two
# incompatible CryptoRngCore traits and a component that cannot be handed the
# caller's RNG.
deny = []

[[bans.skip-tree]]
crate = "windows-sys"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# hashsigs-rs is consumed from its GitLab repository at a pinned revision.
allow-git = ["https://gitlab.com/quip.network/hashsigs-rs.git"]
