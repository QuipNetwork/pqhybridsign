[package]
name = "pqhybridsign-shrincs"
description = "Stateful hash-based hybrid signatures: H5 (ed25519 + SHRINCS) and H6 (sr25519 + SHRINCS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pqhybridsign-core = { path = "../pqhybridsign-core", version = "0.0.0-rc1" }
pqhybridsign = { path = "../pqhybridsign", version = "0.0.0-rc1" }
hashsigs-rs.workspace = true
subtle.workspace = true
zeroize.workspace = true
sha3 = { version = "0.10", default-features = false }

[dev-dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
trybuild = "1"

[features]
default = ["profile-256s"]
profile-256s = ["hashsigs-rs/profile-256s"]
profile-256s-sha2 = ["hashsigs-rs/profile-256s-sha2"]
profile-128s-q18 = ["hashsigs-rs/profile-128s-q18"]
profile-128s-q20 = ["hashsigs-rs/profile-128s-q20"]

[lints]
workspace = true
