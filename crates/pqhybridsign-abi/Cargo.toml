[package]
name = "pqhybridsign-abi"
description = "Type-erased, runtime-dispatched API over the pqhybridsign suites, the foundation for the C, WebAssembly and Python bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# crates.io refuses a crate with a git dependency, and hashsigs-rs is
# pinned to a GitLab revision. Recorded decision on pqhs-eig: this crate
# is not a publication candidate until hashsigs-rs reaches crates.io.
# Remove this line when it does.
publish = false

[dependencies]
pqhybridsign = { path = "../pqhybridsign", version = "0.0.0-rc1" }
pqhybridsign-core = { path = "../pqhybridsign-core", version = "0.0.0-rc1" }
pqhybridsign-shrincs = { path = "../pqhybridsign-shrincs", version = "0.0.0-rc1" }
rand_core.workspace = true
zeroize.workspace = true

[dev-dependencies]
rand_core = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
