[package]
name = "pqhybridsign-abi"
description = "Type-erased, runtime-dispatched API over the pqhybridsign suites, the foundation for the C, WebAssembly and Python bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Not published to crates.io. The type-erased API exists only to carry the
# C, Python, and WebAssembly bindings, and those three crates reach it by
# path, not by registry version. No published crate depends on it, so
# publishing it adds a crates.io release and a trusted-publisher
# registration for nothing. Remove this line only if an external consumer
# ever needs to build a binding on the runtime-dispatch API directly.
publish = false

[dependencies]
# `vrf` and `mnemonic` are off by default in `pqhybridsign` because a
# signing-only Rust build should not compile the VRF's curve arithmetic or
# BIP39's PBKDF2. A binding consumer has no such choice: they get the
# compiled artifact, so a feature left off here is a mechanism that does
# not exist for C, Python and JavaScript callers at all.
pqhybridsign = { path = "../pqhybridsign", version = "0.0.0", features = ["vrf", "mnemonic"] }
rand_core.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The shared `MemoryBudget` test double. Path-only, so `cargo package`
# strips it and the unpublished crate never blocks a release.
pqhybridsign-test-support = { path = "../pqhybridsign-test-support" }
rand_core = { workspace = true, features = ["getrandom"] }

[lints]
workspace = true
