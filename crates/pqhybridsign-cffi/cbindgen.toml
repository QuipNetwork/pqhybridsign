language = "C"
header = """/* SPDX-License-Identifier: AGPL-3.0-or-later
 *
 * Generated by cbindgen from crates/pqhybridsign-cffi. Do not edit by hand;
 * run `cargo run --example gen_header -p pqhybridsign-cffi` and commit the
 * result. `cargo test -p pqhybridsign-cffi` fails if this file drifts from
 * the source it was generated from.
 */"""
include_guard = "PQHYBRIDSIGN_H"
no_includes = true
usize_is_size_t = true
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
documentation = true
documentation_style = "doxy"
style = "type"

[export]
item_types = ["functions", "constants", "structs", "enums"]

[enum]
prefix_with_name = true
