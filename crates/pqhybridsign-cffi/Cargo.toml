[package]
name = "pqhybridsign-cffi"
description = "C ABI binding over pqhybridsign-abi: extern \"C\" entry points for the six hybrid suites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# crates.io refuses a crate with a git dependency, and hashsigs-rs is
# pinned to a GitLab revision. Recorded decision on pqhs-eig: this crate
# is not a publication candidate until hashsigs-rs reaches crates.io.
# Remove this line when it does.
publish = false

[lib]
name = "pqhybridsign_cffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pqhybridsign-abi = { path = "../pqhybridsign-abi", version = "0.0.0-rc1" }
rand_core = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
cbindgen = "0.29.4"

# Cargo forbids combining `[lints] workspace = true` with any per-lint
# override in the same manifest ("cannot override `workspace.lints` in
# `lints`"), so this crate cannot use the `workspace = true` shortcut the
# other crates use. It restates the workspace tables from the root
# `Cargo.toml` here and overrides only `unsafe-code`: this crate is the
# FFI boundary, every entry point takes raw pointers from a caller the
# compiler cannot see, and the unsafe is confined to the pointer-to-slice
# conversions at the boundary, each carrying a `// Safety:` comment naming
# its invariant.
[lints.rust]
missing-docs           = "deny"
unsafe-code            = "allow"
unused-must-use        = "deny"
unreachable-pub        = "warn"
unused-qualifications  = "warn"

[lints.clippy]
unwrap-used      = "deny"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
expect-used      = "deny"
indexing-slicing = "allow"
allow-attributes = "deny"
