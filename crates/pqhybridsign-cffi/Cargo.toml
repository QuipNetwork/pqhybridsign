[package]
name = "pqhybridsign-cffi"
description = "C ABI binding over pqhybridsign-abi: extern \"C\" entry points for the six hybrid suites"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Not a crates.io publication candidate: this binding ships through its
# own channel (see DESIGN.md's crates table), and a Rust consumer wants
# pqhybridsign or pqhybridsign-shrincs, not a foreign-ABI wrapper.
publish = false

[lib]
name = "pqhybridsign_cffi"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
pqhybridsign-abi = { path = "../pqhybridsign-abi", version = "0.0.0-rc8" }
rand_core = { workspace = true, features = ["getrandom"] }

[dev-dependencies]
cbindgen = "0.29.4"

[lints]
workspace = true
