[package]
name = "pqhybridsign"
description = "Hybrid classical/post-quantum signatures: H1-H4 lattice (ML-DSA-44, FN-DSA-512) and H5/H6 stateful hash-based (SHRINCS)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
subtle.workspace = true
zeroize.workspace = true
rand_core.workspace = true
hkdf.workspace = true
sha2.workspace = true
ed25519-zebra.workspace = true
schnorrkel.workspace = true
fips204.workspace = true
fn-dsa.workspace = true
# Stateful hash-based backend for H5/H6. Optional: a SHRINCS profile feature
# is the only thing that turns it on, so a lattice-only build never compiles
# or downloads it or `sha3`.
hashsigs-rs = { workspace = true, optional = true }
sha3 = { version = "0.10", default-features = false, optional = true }
# BIP39 mnemonic-to-master-seed derivation, behind the `mnemonic` feature.
# Pinned to the same 2.x line quip-protocol-rs uses so entropy extraction is
# bit-identical; `default-features = false` keeps English-only, no
# unicode-normalization.
bip39 = { version = "2.2", default-features = false, optional = true }
# PBKDF2-HMAC-SHA512 for the Substrate seed derivation. Pinned to the 0.12
# line (matching `substrate-bip39`'s own dependency) rather than the newer
# 0.13, which depends on `digest` 0.11 and would pull a second `digest`
# major version alongside the `sha2` 0.10 already in this workspace.
pbkdf2 = { version = "0.12", default-features = false, optional = true }
hmac = { version = "0.12", default-features = false, optional = true }

[dev-dependencies]
subtle.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
# Property tests over the encoders and decoders, named as a requirement by
# DESIGN.md. Dev-only, so it reaches no published artifact.
proptest = "1.11.0"
# Compile-fail tests for the stateful API's type-level guards.
trybuild = "1"
# Independent oracle for the strict RFC 8032 ed25519 checks that
# `ed25519-zebra` (ZIP-215) does not expose. Dev-only: `cargo build` never
# pulls dev-dependencies, so the no-allocator build stays alloc-free.
curve25519-dalek = { version = "4.1", default-features = false, features = [
    "precomputed-tables",
    "alloc",
    "digest",
] }

[features]
default = ["std", "stateful"]
std = ["alloc", "schnorrkel/std", "ed25519-zebra/std"]
alloc = []
# Chain-neutral BIP39 mnemonic-to-master-seed derivation. Off by default: it
# is the one feature that pulls in `bip39`, `pbkdf2` and `hmac`, none of
# which any suite needs. `zeroize/alloc` is enabled here, not by `alloc`
# itself, because only this feature wipes a heap-allocated buffer (the
# PBKDF2 salt); the plain `alloc` feature never touches `zeroize` at all.
mnemonic = ["alloc", "dep:bip39", "dep:pbkdf2", "dep:hmac", "zeroize/alloc"]
# H5/H6 stateful hash-based suites, on by default. This is the friendly
# on-switch: it selects the 256s profile. To use another profile, disable
# default features and name it (each profile turns the suites on by itself).
# hashsigs-rs allows exactly one profile per build.
stateful = ["profile-256s"]
profile-256s = ["std", "dep:hashsigs-rs", "dep:sha3", "hashsigs-rs/profile-256s"]
profile-256s-sha2 = ["std", "dep:hashsigs-rs", "dep:sha3", "hashsigs-rs/profile-256s-sha2"]
profile-128s-q18 = ["std", "dep:hashsigs-rs", "dep:sha3", "hashsigs-rs/profile-128s-q18"]
profile-128s-q20 = ["std", "dep:hashsigs-rs", "dep:sha3", "hashsigs-rs/profile-128s-q20"]

[lints]
workspace = true
