[package]
name = "pqhybridsign"
description = "Hybrid post-quantum signatures: H1/H3 (ML-DSA-44) and H2/H4 (FN-DSA-512)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
pqhybridsign-core = { path = "../pqhybridsign-core", version = "0.0.0-rc1", default-features = false }
subtle.workspace = true
zeroize.workspace = true
rand_core.workspace = true
ed25519-zebra.workspace = true
schnorrkel.workspace = true
fips204.workspace = true
fn-dsa.workspace = true
sha2.workspace = true

[dev-dependencies]
hex.workspace = true
rand_core = { workspace = true, features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Test-only. `ed25519-zebra` verifies under ZIP-215, so the strict RFC 8032
# checks in tests/ed25519_strict.rs need curve arithmetic that
# `ed25519-zebra` does not expose. The version range matches the one
# `ed25519-zebra` 4.2 already resolves, so this adds a dev-dependency edge
# and no new crate to the graph. It never enters a release build.
# `alloc` is required for `EdwardsPoint::vartime_double_scalar_mul_basepoint`
# (the two-scalar multiplication the strict verification equation needs) and
# `digest` for `Scalar::from_hash`. Both are dev-only: `cargo build` never
# pulls in dev-dependencies, so the `--no-default-features` wasm build stays
# alloc-free regardless of what this line enables.
curve25519-dalek = { version = "4.1", default-features = false, features = [
    "precomputed-tables",
    "alloc",
    "digest",
] }

[features]
default = ["std"]
std = ["pqhybridsign-core/std", "schnorrkel/std", "ed25519-zebra/std"]
