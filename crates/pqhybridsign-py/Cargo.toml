[package]
name = "pqhybridsign-py"
description = "Python bindings for pqhybridsign, built on pyo3 and the type-erased ABI crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# Not a crates.io publication candidate: this binding ships through its
# own channel (see DESIGN.md's crates table), and a Rust consumer wants
# pqhybridsign or pqhybridsign-shrincs, not a foreign-ABI wrapper.
publish = false

[lib]
name = "_pqhybridsign"
crate-type = ["cdylib", "rlib"]
# No Rust test harness. Linking one requires libpython, which an
# `extension-module` build deliberately does not link: the interpreter
# resolves those symbols when it loads the wheel. Building a test binary
# therefore either fails to link or drags in a libpython that defeats the
# abi3 portability the wheel exists to provide. The behaviour here is
# covered by the pytest suite under `tests/`, which exercises the real
# extension through the interpreter that will actually load it. That
# suite includes `test_suite_round_trips_every_value`, the running pin
# that `suite::tests::suite_round_trips_every_value` cannot provide
# while this target stays disabled.
test = false

[dependencies]
pqhybridsign-abi = { path = "../pqhybridsign-abi", version = "0.0.0-rc7" }
pyo3 = { version = "0.29.2", default-features = false, features = ["macros", "abi3-py39", "extension-module"] }
rand_core = { workspace = true, features = ["getrandom"] }
zeroize = { workspace = true }

[package.metadata.maturin]
python-source = "python"

[lints]
workspace = true
