[package]
name = "pqhybridsign-py"
description = "Python bindings for pqhybridsign, built on pyo3 and the type-erased ABI crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
# crates.io refuses a crate with a git dependency, and hashsigs-rs is
# pinned to a GitLab revision. Recorded decision on pqhs-eig: this crate
# is not a publication candidate until hashsigs-rs reaches crates.io.
# Remove this line when it does.
publish = false

[lib]
name = "_pqhybridsign"
crate-type = ["cdylib", "rlib"]
# No Rust test harness. Linking one requires libpython, which an
# `extension-module` build deliberately does not link: the interpreter
# resolves those symbols when it loads the wheel. Building a test binary
# therefore either fails to link or drags in a libpython that defeats the
# abi3 portability the wheel exists to provide. The behaviour here is
# covered by the pytest suite under `tests/`, which exercises the real
# extension through the interpreter that will actually load it. That
# suite includes `test_suite_round_trips_every_value`, the running pin
# that `suite::tests::suite_round_trips_every_value` cannot provide
# while this target stays disabled.
test = false

[dependencies]
pqhybridsign-abi = { path = "../pqhybridsign-abi", version = "0.0.0-rc1" }
pyo3 = { version = "0.29.2", default-features = false, features = ["macros", "abi3-py39", "extension-module"] }
rand_core = { workspace = true, features = ["getrandom"] }
zeroize = { workspace = true }

[package.metadata.maturin]
python-source = "python"

# Cargo forbids combining `[lints] workspace = true` with any per-lint
# override in the same manifest ("cannot override `workspace.lints` in
# `lints`"), so this crate cannot use the `workspace = true` shortcut the
# other crates use. It restates the workspace tables from the root
# `Cargo.toml` here and overrides only `unsafe-code`: the only `unsafe`
# code reachable from this crate is what pyo3's
# `#[pymodule]`/`#[pyclass]`/`#[pyfunction]` macros generate to satisfy the
# CPython C API; nothing in this crate's own source writes `unsafe`.
[lints.rust]
missing-docs           = "deny"
unsafe-code            = "allow"
unused-must-use        = "deny"
unreachable-pub        = "warn"
unused-qualifications  = "warn"

[lints.clippy]
unwrap-used      = "deny"
panic            = "deny"
todo             = "deny"
unimplemented    = "deny"
expect-used      = "deny"
indexing-slicing = "allow"
allow-attributes = "deny"
