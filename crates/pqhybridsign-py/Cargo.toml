[package]
name = "pqhybridsign-py"
description = "Python bindings for pqhybridsign, built on pyo3 and the type-erased ABI crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "_pqhybridsign"
crate-type = ["cdylib", "rlib"]

[dependencies]
pqhybridsign-abi = { path = "../pqhybridsign-abi" }
pyo3 = { version = "0.29.2", default-features = false, features = ["macros", "abi3-py39"] }
rand_core = { workspace = true, features = ["getrandom"] }
zeroize = { workspace = true }

[package.metadata.maturin]
python-source = "python"
