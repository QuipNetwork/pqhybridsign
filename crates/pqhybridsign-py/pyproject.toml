[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pqhybridsign"
# Derived from crates/pqhybridsign-py/Cargo.toml's `version.workspace =
# true` (currently 0.0.0-rc1) rather than pinned here, so the wheel cannot
# drift from the workspace version the way a literal copy did before.
dynamic = ["version"]
description = "Python bindings for pqhybridsign, a suite of hybrid classical/post-quantum signature schemes"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

[tool.maturin]
python-source = "python"
module-name = "pqhybridsign._pqhybridsign"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
