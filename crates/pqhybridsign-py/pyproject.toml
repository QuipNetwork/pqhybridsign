[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pqhybridsign"
# Derived from crates/pqhybridsign-py/Cargo.toml's `version.workspace =
# true` (currently 0.0.0-rc2) rather than pinned here, so the wheel cannot
# drift from the workspace version the way a literal copy did before.
dynamic = ["version"]
description = "Python bindings for pqhybridsign, a suite of hybrid classical/post-quantum signature schemes"
readme = "README.md"
# The workspace LICENSE lives two directories up from this file (the crate
# root, then the crates/ directory). The modern PEP 639 mechanisms --
# `license = "<SPDX expression>"` plus a `license-files` glob, or this
# crate's own `[tool.maturin] include` -- both refuse a pattern that steps
# outside the project directory with `..`, so neither can reach it. The
# legacy PEP 621 `license.file` form has no such restriction: maturin
# copies the file it names into the wheel's `dist-info/licenses/` and the
# sdist's package root, and writes the matching `License-File` metadata
# entry from wherever it copied the file, not from a project-relative
# guess.
#
# quip-solver-core hit the failure mode this guards against, with a
# pyproject.toml that sat next to its LICENSE and used the modern form:
# maturin wrote `License-File: LICENSE` into sdist metadata but packed no
# such file, because a stale copy of that logic did not account for a
# root-level file outside the crate. twine check accepted the mismatch;
# PyPI rejected the upload with 400 after already accepting the wheel of
# the same version. See scripts/check-sdist-license-files.sh, which
# catches this before upload.
license = { file = "../../LICENSE" }
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
]

[tool.maturin]
python-source = "python"
module-name = "pqhybridsign._pqhybridsign"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
