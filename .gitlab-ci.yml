# Stage order is publish order. The reversible registries go first: an
# unwanted npm version can be unpublished for 72 hours and PyPI tolerates
# re-upload attempts with --skip-existing, but a crates.io version can only
# ever be yanked, never replaced. `crates` therefore runs last, and `notes`
# creates the release page only once every artifact is live.
stages: [check, test, validate, smoke, release, pypi, crates, notes]

# Without this block a job that declares no `rules:` never runs in a detached
# merge-request pipeline, so the only job that reached one was schedule-exists
# (its last rule is `when: always`). The merge widget then showed a green
# pipeline that had compiled nothing, and the merge gate was vacuous. That
# already landed one bad merge: MR !2 passed while its own branch pipeline
# failed, and main went red until cdffad7.
#
# The `when: never` clause is what keeps the cost flat rather than doubling
# it. Once a merge request is open, the branch push stops producing its own
# pipeline and the merge-request pipeline is the only one for that commit.
# It is limited to push pipelines on purpose. Without that limit the clause
# also cancels scheduled, web and API pipelines on a branch that happens to
# have an open merge request, which would silently stop the scheduled
# `mutants` job for as long as the merge request stays open.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: rust:1.97.1
  before_script:
    - rustup component add clippy rustfmt
    - rustup target add wasm32-unknown-unknown

variables:
  NODE_MAJOR: "24"

.setup-node:
  script:
    # One block with pipefail, because `curl ... | bash -` reports only bash's
    # status. bash reading an empty stdin exits 0, so a failed or truncated
    # download would leave the pipeline believing the repository had been
    # added and fail later, somewhere unrelated.
    - |
      set -euo pipefail
      curl -fsSL "https://deb.nodesource.com/setup_${NODE_MAJOR}.x" | bash -
    - apt-get install -y --no-install-recommends nodejs
    # Assert the major rather than printing it. The nodesource script chooses
    # the version, so this is the only place that can catch it installing
    # something other than what the jobs below assume. The npm package
    # declares engines.node >= 20; Debian bookworm's apt nodejs is 18.
    - |
      set -euo pipefail
      HAVE="$(node --version)"
      if [ "${HAVE%%.*}" != "v${NODE_MAJOR}" ]; then
          echo "expected node ${NODE_MAJOR}.x, got ${HAVE}" >&2
          exit 1
      fi

fmt:
  stage: check
  script:
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - cargo clippy --locked --workspace --all-targets -- -D warnings
    # `vrf` is off by default, so the workspace run above never compiles the
    # hybrid VRF or its schnorrkel VRF bindings.
    - cargo clippy --locked -p pqhybridsign --all-targets --features vrf -- -D warnings

deps:
  stage: check
  script:
    # All three component crates require rand_core ^0.6, and they must all
    # resolve to the same version so that they share one RngCore trait.
    #
    # `cargo tree -i rand_core` cannot answer this. Once the lockfile holds
    # two versions it exits with "specification rand_core is ambiguous" and
    # prints no tree at all, so counting its root lines reports 0 whatever
    # the truth is. Adding `-e normal,build` does not help, because cargo
    # resolves the package specification before it filters edges.
    #
    # Reading the versions off the forward tree does work, because
    # `-e normal,build` drops the dev-dependency edges before the versions
    # are read. That matters here: proptest is a dev-dependency of
    # pqhybridsign and pulls rand_core 0.9, which reaches no published
    # artifact and does not put a second RngCore in front of any component.
    - |
      set -euo pipefail
      versions=$(cargo tree --locked --workspace -e normal,build --prefix none \
        | grep -o 'rand_core v[0-9][0-9.]*' | sort -u || true)
      count=$(printf '%s\n' "$versions" | grep -c '^rand_core v' || true)
      if [ "$count" -ne 1 ]; then
        echo "Expected exactly one rand_core version outside dev-dependencies, found $count:"
        printf '%s\n' "$versions"
        exit 1
      fi
      echo "rand_core outside dev-dependencies: $versions"

# Refuses any crates.io dependency whose locked version was published within
# the last seven days. A supply-chain attack on a crate is loudest in the
# hours after publication, and the classic trigger is a yanked prior version
# that bait a `cargo update` onto the malicious replacement. The cooldown
# turns that window into a wall. scripts/cooldown-allowlist.toml carries the
# reviewed exemptions for first-party crates. See the incident notes for the
# arrayref 0.3.10 attack this was built in response to.
cooldown:
  stage: check
  script:
    - apt-get update && apt-get install -y --no-install-recommends python3 ca-certificates
    - python3 scripts/check-dependency-cooldown.py

# `pqhybridsign` is required to compile where there is no `std`, both
# with and without an allocator. `wasm32-unknown-unknown` cannot prove that
# on its own: rustup ships a `std` for it, so a dependency that reached for
# `std` would still link and this check would pass. `thumbv7em-none-eabi`
# has no `std` to link against, which is what makes the requirement
# falsifiable rather than merely stated.
#
# The alloc-only test run is here rather than in `test-debug` because the
# default feature set is `["std", "alloc"]`: under `std` the prelude
# supplies `Vec`, so every missing `use alloc::vec::Vec` is invisible to
# every other job in this file.
no-std:
  stage: check
  script:
    - rustup target add thumbv7em-none-eabi
    - cargo build --locked -p pqhybridsign --no-default-features --target thumbv7em-none-eabi
    - cargo build --locked -p pqhybridsign --no-default-features --features alloc --target thumbv7em-none-eabi
    - cargo build --locked -p pqhybridsign --no-default-features --features mnemonic --target thumbv7em-none-eabi
    # The hybrid VRF has to hold this line too. schnorrkel's own `vrf_sign`
    # draws the DLEQ proof's witness through `getrandom_or_panic`, which
    # panics on a target with no `getrandom`; `vrf` attaches the caller's RNG
    # instead, and this build is what proves it.
    - cargo build --locked -p pqhybridsign --no-default-features --features vrf --target thumbv7em-none-eabi
    - cargo test --locked -p pqhybridsign --no-default-features
    - cargo test --locked -p pqhybridsign --no-default-features --features alloc
    - cargo test --locked -p pqhybridsign --no-default-features --features mnemonic

wasm:
  stage: check
  script:
    - cargo build --locked -p pqhybridsign --target wasm32-unknown-unknown --no-default-features
    - cargo build --locked -p pqhybridsign --target wasm32-unknown-unknown --no-default-features --features alloc
    - cargo build --locked -p pqhybridsign --target wasm32-unknown-unknown --no-default-features --features mnemonic
    # The lattice crate must also build without an allocator: it is the
    # crate that pulls in ed25519-zebra, schnorrkel and fips204, any of
    # which could introduce a std or getrandom dependency.
    - cargo build --locked -p pqhybridsign --target wasm32-unknown-unknown --no-default-features

cross-profile:
  stage: check
  script:
    # Exactly one profile-* feature compiles at a time, so no single build can
    # hold a key from another profile and check that it fails. This job
    # supplies the comparison a build cannot: it derives a fingerprint from
    # each profile fixture public key and asserts the fingerprints all differ.
    # A change that stopped binding the profile into the commitment would
    # collide two of them here.
    - |
      set -euo pipefail
      out=$(mktemp)
      for p in profile-256s profile-256s-sha2 profile-128s-q18 profile-128s-q20; do
        cargo test --locked -p pqhybridsign --release --no-default-features \
          --features "$p" --test cross_profile -- --nocapture \
          | grep CROSS_PROFILE_FINGERPRINT >> "$out"
      done
      total=$(wc -l < "$out")
      # Compare only the commitment field: the label differs by construction
      # (it carries the profile name), so counting distinct labels would pass
      # even if the commitment stopped depending on the profile.
      distinct=$(sed 's/.*commitment=//' "$out" | sort -u | wc -l)
      cat "$out"
      if [ "$total" -ne 4 ] || [ "$distinct" -ne 4 ]; then
        echo "Expected 4 profiles with 4 distinct commitments, got $total lines and $distinct distinct"
        exit 1
      fi

wasm-npm:
  stage: test
  script:
    # Node comes from nodesource, not apt: the npm package declares
    # engines.node >= 20 and its wrapper builds with TypeScript 7, and
    # bookworm's apt nodejs is 18.
    - apt-get update
    - !reference [.setup-node, script]
    # `curl | sh` must fail if curl fails. Without pipefail the installer
    # can run on a truncated script and exit 0.
    - |
      set -euo pipefail
      curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      cd crates/pqhybridsign-wasm
      ./scripts/check-types.sh
      ./scripts/build-npm.sh
      # The Promise-API suite against the built dist/, on top of (not
      # instead of) the raw-export smoke test below, which still guards
      # the underlying wasm-bindgen surface.
      (cd npm && npm test)
      node tests/node/sign_and_verify.mjs

deny:
  stage: check
  script:
    - cargo install cargo-deny --version 0.20.2
    - cargo deny check

doc:
  stage: check
  script:
    - RUSTDOCFLAGS="-D warnings" cargo doc --locked --workspace --no-deps

msrv:
  stage: check
  script:
    # `rust-toolchain.toml` pins `stable`, and a toolchain file overrides
    # `rustup default`. Selecting the toolchain any other way leaves this job
    # running on stable and passing whatever the declared floor is, which is a
    # gate that cannot fail. Only the `+toolchain` argument outranks the file.
    - |
      set -euo pipefail
      msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
      test -n "$msrv"
      rustup toolchain install "$msrv" --profile minimal
      # Prove the override took effect before trusting the check below.
      cargo "+$msrv" --version
      cargo "+$msrv" check --workspace --all-targets

test-debug:
  stage: test
  script:
    - cargo test --locked --workspace
    # `vrf` is not a default feature, so the workspace run above skips the
    # hybrid VRF entirely, including its compile-fail guarantee.
    - cargo test --locked -p pqhybridsign --features vrf

test-release:
  stage: test
  script:
    # subtle uses debug_assert with secret-dependent branches, so release
    # mode exercises different code than the debug build above.
    - cargo test --locked --workspace --release
    - cargo test --locked -p pqhybridsign --release --features vrf

# Full suite under each of the four profiles. Proves the tiering holds: a
# test that generates a key under a 128s profile slows this job and is the
# signal that the gate failed.
#
# Clippy runs per profile as well. The `clippy` job above builds default
# features only, so it never sees the code behind the other three
# `profile-*` gates. Tiering put a lot of code behind those gates, and an
# unused import or dead helper there compiles clean everywhere else.
profile-matrix:
  stage: test
  script:
    - |
      set -euo pipefail
      for p in profile-256s profile-256s-sha2 profile-128s-q18 profile-128s-q20; do
        cargo clippy --locked -p pqhybridsign --all-targets --no-default-features \
          --features "$p" -- -D warnings
        cargo test --locked -p pqhybridsign --release --no-default-features \
          --features "$p"
      done

# DESIGN.md line 846 specifies mutation testing over the encoding and
# domain-separation modules, where a skipped check is the dangerous failure.
# Scheduled rather than per-pipeline: a full run rebuilds and retests once
# per mutant, which is minutes, not seconds. The scope lives in
# .cargo/mutants.toml so a local `cargo mutants` run matches this job.
#
# The timeout is measured, not guessed. A full run of the 160 mutants in
# scope took 931 seconds on a developer workstation with a warm cargo
# registry. cargo-mutants tests one mutant at a time by default, so that is
# a serial figure: a 12.6-second baseline build, a 57.1-second baseline
# test, then a mean 1.25-second incremental rebuild and 4.26-second test per
# mutant. A caught mutant is cheap because cargo test stops at the first
# failure rather than running the whole 57-second suite.
#
# A shared runner is slower on each of those parts, and it also pays to
# build cargo-mutants from source before the first mutant runs, which the
# 931 seconds does not include. That puts a plausible CI run somewhere
# under two hours. 3h is the ceiling rather than the estimate, because a job
# that always times out teaches people to ignore a red pipeline.
#
# The version is pinned. This scope and these config keys were verified
# against 27.1.0, and a scheduled `cargo install` otherwise fetches whatever
# crates.io returns that day, which is the same unreviewed-fetch risk the
# cooldown job exists to stop for Cargo.lock.
mutants:
  stage: test
  timeout: 3h
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - cargo install cargo-mutants --locked --version 27.1.0
    - cargo mutants -- --workspace --locked
  artifacts:
    when: always
    paths:
      - mutants.out/
    expire_in: 30 days

# Real 128s keygen against the pinned H5 fixture. This is the only real 128s
# operation left per commit: it generates a real key and compares the public
# key against pinned fixture bytes, which covers the 2^18 hypertree root
# derivation. Release is mandatory; debug is roughly 67 times slower.
smoke-128s-q18:
  stage: test
  script:
    - |
      cargo test --locked -p pqhybridsign --release --no-default-features \
        --features profile-128s-q18 --test smoke_128s -- --ignored

# regenerate-fixtures is gated on a pipeline schedule. If no schedule
# exists the job never runs, and the repository silently claims fixture
# coverage for the signing paths that it does not have. This job makes
# that state loud instead of invisible.
#
# CI_JOB_TOKEN cannot read the pipeline_schedules API: that endpoint is not
# in the GitLab job-token allowlist, so a real schedule reads back the same
# as a permission failure. Until a masked (and NOT protected — see the
# report) project access token is added, this job cannot tell "no
# schedule" apart from "no permission" and so cannot block the pipeline on
# a false negative. It is allow_failure and its output must be read rather
# than trusted to gate merges. No jq in the rust image, so the
# response is parsed with the python3 already present.
schedule-exists:
  stage: test
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - when: always
  script:
    - |
      set -euo pipefail
      tmp=$(mktemp)
      code=$(curl -sS -o "$tmp" -w '%{http_code}' \
        --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipeline_schedules")
      if [ "${code}" != "200" ]; then
        echo "pipeline_schedules API returned HTTP ${code}."
        echo "CI_JOB_TOKEN cannot read this endpoint (expected until a"
        echo "read_api project access token replaces it; see the report)."
        exit 1
      fi
      count=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))))' "$tmp")
      if [ "${count}" = "0" ]; then
        echo "No pipeline schedule is configured (HTTP 200, empty list)."
        echo "regenerate-fixtures is gated on a schedule and therefore never runs."
        echo "The stateless signing paths have no automated coverage."
        echo "Create a schedule in Settings > CI/CD > Pipeline schedules."
        exit 1
      fi
      echo "${count} pipeline schedule(s) configured."

# Only detector of fixture staleness for the signing paths, and the only
# place the 175-second stateless signing cost still runs. Regenerates every
# profile fixture and fails if any committed file drifted.
regenerate-fixtures:
  stage: test
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      set -euo pipefail
      for p in profile-256s profile-256s-sha2 profile-128s-q18 profile-128s-q20; do
        cargo test --locked -p pqhybridsign --release --no-default-features \
          --features "$p" --test generate_fixtures -- --ignored --nocapture
      done
      # The wasm fixture is single-profile by construction: pqhybridsign-wasm
      # builds against one SHRINCS profile, so unlike the loop above there is
      # one file to regenerate, and it records which profile made it.
      cargo test --locked -p pqhybridsign-wasm --release \
        --test generate_verify_with_stored_public_key_fixture -- --ignored --nocapture
      # `git diff` alone would ignore a fixture the generator created rather
      # than overwrote, so an added profile would pass silently. Comparing the
      # whole porcelain status catches modified and untracked files together.
      drift=$(git status --porcelain \
        crates/pqhybridsign/tests/vectors/ \
        crates/pqhybridsign-wasm/tests/node/)
      if [ -n "$drift" ]; then
        echo "Fixtures drifted from the committed files:"
        echo "$drift"
        git diff \
          crates/pqhybridsign/tests/vectors/ \
          crates/pqhybridsign-wasm/tests/node/
        exit 1
      fi

c-abi:
  stage: test
  script:
    # Builds the cdylib/staticlib, then compiles and links tests/c/main.c
    # against the checked-in header and runs it: proof the header and the
    # library it describes agree, not just that the Rust side compiles.
    - crates/pqhybridsign-cffi/tests/c/run.sh

python:
  stage: test
  script:
    # Builds the pyo3 extension and runs the pytest suite, including the
    # copy, deepcopy and pickle guards on StatefulSecretKey. The C ABI has
    # c-abi and wasm has wasm-npm. This is the matching Python gate.
    - |
      set -euo pipefail
      apt-get update && apt-get install -y --no-install-recommends \
        python3 python3-pip python3-venv python3-dev
      python3 -m venv /tmp/pqhs-py
      . /tmp/pqhs-py/bin/activate
      pip install 'maturin>=1.7,<2.0' pytest
      cd crates/pqhybridsign-py
      maturin develop
      pytest

# ---------------------------------------------------------------------------
# Release pipeline.
#
# The dry run always runs. The real publish runs only on a tag.
#
#   release:validate  every pipeline. Dry-runs all four publish paths.
#   smoke:*           every pipeline. Install the built artifacts and run
#                     the roundtrip examples against them.
#   release:npm       tag only. Publishes @quip.network/pqhybridsign.
#   release:pypi      tag only. Publishes the wheel and sdist.
#   release:clib      tag only. Attaches the C library tarball.
#   release:crates    tag only. Publishes the four crates, last, because
#                     crates.io is the one registry that can never accept a
#                     replacement for a version.
#   release:notes     tag only. Creates the release page once all of the
#                     above are live.
#
# No CI/CD variables and no stored secrets. All three registries use OIDC
# trusted publishing: each pipeline proves its own identity and receives a
# short-lived token. Every registry needs its publisher registered once
# against namespace quip.network, project pqhybridsign, pipeline
# .gitlab-ci.yml, and the environment named on the job below (npm, pypi,
# crates-io). crates.io needs one registration per crate. A protected tag
# pattern `v*` keeps these environments reachable only from a
# Maintainer-pushed tag.
#
# The first rc1 artifacts were published by hand from the CLI, so every
# publish job skips a version that is already live rather than failing on
# it. A re-run after a partial failure is safe the same way.
# ---------------------------------------------------------------------------

.on-release-tag: &on-release-tag
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d/

# Runs on every pipeline. This is the gate everything downstream hangs off.
#
# It writes to no registry: every step is a dry run or a local build, and
# `make check-release` runs the same steps locally. Its artifacts are the
# exact files the publish jobs upload, which is what lets the smoke jobs
# test the real thing instead of a rebuild.
release:validate:
  stage: validate
  # No `rules:` on purpose: a broken release setup should fail on a branch
  # pipeline, not halfway through a release.
  #
  # `needs:` starts a job as soon as its own needs are met and ignores stage
  # order, so a job left off this list is not waited for at all. Three jobs
  # are deliberately absent: schedule-exists is allow_failure and
  # informational, so it must never gate a release; regenerate-fixtures and
  # mutants exist only in scheduled pipelines, and a needs: edge onto a job
  # that is absent from the pipeline makes the whole pipeline invalid.
  needs:
    - job: fmt
    - job: clippy
    - job: deps
    - job: cooldown
    - job: no-std
    - job: wasm
    - job: cross-profile
    - job: msrv
    - job: doc
    - job: deny
    - job: test-debug
    - job: test-release
    - job: wasm-npm
    - job: profile-matrix
    - job: smoke-128s-q18
    - job: c-abi
    - job: python
  dependencies: []
  timeout: 60m
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends python3 python3-venv python3-dev jq
    - !reference [.setup-node, script]
    - |
      set -euo pipefail
      curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
  script:
    # The C library tarball carries the tag in its name on a tag pipeline,
    # and the short SHA otherwise, so a branch artifact is never mistaken
    # for a release one.
    - export TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    # On a tag pipeline the tag IS the version, so the manifests must
    # already agree with it. Checked before anything is built, because this
    # is the last point where the answer costs nothing.
    - |
      set -euo pipefail
      if [ -n "${CI_COMMIT_TAG:-}" ]; then
          python3 scripts/check-release-version.py "$CI_COMMIT_TAG"
      else
          echo "Not a tag pipeline; skipping the tag/manifest version check."
      fi
    - make check-release TAG="$TAG"
  artifacts:
    name: "pqhybridsign-artifacts-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    paths:
      - target/package/*.crate
      - dist/python/*.whl
      - dist/python/*.tar.gz
      - crates/pqhybridsign-wasm/npm/*.tgz
      - dist/pqhybridsign-clib-*.tar.gz
      - dist/pqhybridsign-clib-*.tar.gz.sha256
    expire_in: 1 week

.smoke:
  stage: smoke
  needs:
    - job: release:validate
      artifacts: true
  timeout: 30m

# Builds against the PACKAGED crates, unpacked from the .crate tarballs,
# rather than against crates/. [patch.crates-io] redirects the registry
# dependency to the unpacked package, so a file missing from the tarball
# fails here instead of after publication. cargo warns about patch entries
# the example does not use (shrincs, abi); the warning is harmless and the
# loop stays uniform.
smoke:rust:
  extends: .smoke
  script:
    - mkdir -p /opt/pkg && for f in target/package/*.crate; do tar xzf "$f" -C /opt/pkg; done
    - ls /opt/pkg
    - |
      {
        echo
        echo '[patch.crates-io]'
        for d in /opt/pkg/*/; do
          name=$(basename "${d%/}" | sed -E 's/-[0-9]+\.[0-9]+\.[0-9]+.*$//')
          echo "$name = { path = \"${d%/}\" }"
        done
      } >> examples/rust/Cargo.toml
    - tail -8 examples/rust/Cargo.toml
    - cd examples/rust && cargo run --release

# Compiles against the released tarball's header and library only. The
# repository's target/ is never on the include or link path, so a header
# that does not match the shipped object fails here.
smoke:cpp:
  extends: .smoke
  script:
    - mkdir -p /opt/clib && tar xzf dist/pqhybridsign-clib-*.tar.gz -C /opt/clib
    - ls -R /opt/clib
    - g++ -std=c++17 -O2 -Wall -Wextra -I/opt/clib/include examples/cpp/roundtrip.cpp
      -o /tmp/roundtrip_cpp -L/opt/clib -Wl,-rpath,/opt/clib -lpqhybridsign_cffi
    - /tmp/roundtrip_cpp

# Installs the built wheel into a fresh virtual environment. The example
# imports pqhybridsign from site-packages, not from crates/ in this tree.
smoke:python:
  extends: .smoke
  image: python:3.11
  before_script: []
  script:
    - python -m venv /opt/venv
    - /opt/venv/bin/pip install --quiet dist/python/*.whl
    - /opt/venv/bin/python -c "import pqhybridsign; print('pqhybridsign from', pqhybridsign.__file__)"
    - /opt/venv/bin/python examples/python/roundtrip.py

# Installs the packed tarball into a clean project. The example resolves
# @quip.network/pqhybridsign from node_modules, not from crates/ in this
# tree.
smoke:typescript:
  extends: .smoke
  before_script:
    - apt-get update
    - !reference [.setup-node, script]
  script:
    - mkdir -p /opt/ts && cp -r examples/typescript/src examples/typescript/tsconfig.json examples/typescript/package.json /opt/ts/
    - cd /opt/ts
    - npm install --no-audit --no-fund "$CI_PROJECT_DIR"/crates/pqhybridsign-wasm/npm/quip.network-pqhybridsign-*.tgz
    - npm install --no-audit --no-fund
    - npx tsc
    - node dist/roundtrip.js

release:npm:
  stage: release
  <<: *on-release-tag
  needs:
    - job: release:validate
      artifacts: true
    - job: smoke:rust
    - job: smoke:cpp
    - job: smoke:python
    - job: smoke:typescript
  environment:
    name: npm
    url: https://www.npmjs.com/package/@quip.network/pqhybridsign
  # NPM_ID_TOKEN authenticates the publish. SIGSTORE_ID_TOKEN signs a
  # provenance attestation, which this job disables because npm accepts one
  # only from a GitLab-hosted runner. It stays declared so that moving this
  # job to a hosted runner is the only change needed to restore provenance.
  id_tokens:
    NPM_ID_TOKEN:
      aud: npm:registry.npmjs.org
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  timeout: 30m
  before_script:
    - apt-get update
    - !reference [.setup-node, script]
    # 11.5.1 is the floor for OIDC trusted publishing.
    - npm install -g npm@latest
  script:
    # Preflight, because npm reports a rejected or missing OIDC token as
    # ENEEDAUTH, which sends you looking for a password this pipeline
    # deliberately does not have.
    - |
      set -euo pipefail
      require_min() {
          local what="$1" have="$2" want="$3"
          if [ "$(printf '%s\n%s\n' "$want" "$have" | sort -V | head -n1)" != "$want" ]; then
              echo "$what $have is below the $want that npm trusted publishing requires." >&2
              exit 1
          fi
      }
      NODE_HAVE="$(node --version)"
      NPM_HAVE="$(npm --version)"
      echo "node ${NODE_HAVE}, npm ${NPM_HAVE}"
      require_min node "${NODE_HAVE#v}" 22.14.0
      require_min npm "${NPM_HAVE}" 11.5.1
      : "${NPM_ID_TOKEN:?NPM_ID_TOKEN is unset. Declare it under id_tokens: with aud: npm:registry.npmjs.org}"
      echo "NPM_ID_TOKEN is present (${#NPM_ID_TOKEN} chars)."
    - cd crates/pqhybridsign-wasm/npm
    # Exactly one tarball, or the glob below would publish an arbitrary one.
    # release:validate packs it after deleting stale ones, so a second file
    # here means the artifact set is not what this job expects.
    - |
      set -euo pipefail
      set -- ./quip.network-pqhybridsign-*.tgz
      if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
          echo "expected exactly one packed tarball, found: $*" >&2
          exit 1
      fi
      TARBALL="$1"
      export TARBALL
      echo "publishing $TARBALL"
    # A version that is already live is a success, not a failure: rc1 was
    # published by hand to create the package for trusted publishing, and a
    # re-run after a partial pipeline failure lands here too. npm has no
    # --skip-existing, so the check is explicit.
    #
    # The dist-tag is derived from the version: a semver prerelease (a
    # hyphen after the version core) publishes under `next`, anything else
    # under `latest`. Publishing the packed tarball, not the directory,
    # skips prepack entirely, so what ships is the artifact
    # smoke:typescript installed and drove.
    #
    # --no-provenance is required, not a preference: npm turns provenance
    # on by itself under trusted publishing and accepts the bundle only
    # from a GitLab-hosted runner.
    - |
      set -euo pipefail
      VERSION="${CI_COMMIT_TAG#v}"
      if [ -n "$(npm view "@quip.network/pqhybridsign@${VERSION}" version 2>/dev/null || true)" ]; then
          echo "@quip.network/pqhybridsign@${VERSION} is already on npm; nothing to publish."
          exit 0
      fi
      case "$VERSION" in
          *-*) DIST_TAG="next" ;;
          *) DIST_TAG="latest" ;;
      esac
      echo "version $VERSION publishes under dist-tag $DIST_TAG"
      npm publish "$TARBALL" --tag "$DIST_TAG" --no-provenance

release:pypi:
  stage: pypi
  # A plain Python image, because this job builds nothing. It promotes the
  # wheel and sdist release:validate built and smoke:python installed and
  # ran.
  image: python:3.11
  <<: *on-release-tag
  # Waits for npm, the one registry whose publish can still be undone.
  needs:
    - job: release:validate
      artifacts: true
    - job: smoke:rust
    - job: smoke:cpp
    - job: smoke:python
    - job: smoke:typescript
    - job: release:npm
  # Matches the environment registered on the PyPI trusted publisher. PyPI
  # rejects the OIDC exchange when the two disagree.
  environment:
    name: pypi
    url: https://pypi.org/project/pqhybridsign/
  # The audience must be the literal `pypi`, not `pypi.org`.
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  timeout: 30m
  before_script: []
  script:
    - python3 -m pip install --disable-pip-version-check twine
    - ls -la dist/python/
    - twine check dist/python/*
    # Exchange the short-lived GitLab token for a PyPI API token. Minted
    # in-process by python3 rather than by curl: the OIDC token is a live
    # credential, and putting it in a process argument list makes it
    # readable through /proc and echoed by any shell trace.
    - |
      set -euo pipefail
      MINTED=$(python3 - <<'PY'
      import json
      import os
      import urllib.request

      request = urllib.request.Request(
          "https://pypi.org/_/oidc/mint-token",
          data=json.dumps({"token": os.environ["PYPI_ID_TOKEN"]}).encode(),
          headers={"Content-Type": "application/json"},
      )
      with urllib.request.urlopen(request) as response:
          print(json.load(response)["token"])
      PY
      )
      # --skip-existing so a re-run after a partial failure is safe.
      # --verbose because twine prints the HTTP status and hides the body,
      # and a bare "400 Bad Request" says nothing about the cause.
      TWINE_USERNAME=__token__ TWINE_PASSWORD="$MINTED" twine upload --verbose --skip-existing dist/python/*
  artifacts:
    paths:
      - dist/python/*.whl
      - dist/python/*.tar.gz
    expire_in: never

# The C library ships as a release asset rather than through a registry,
# because a C consumer wants the compiled object and the header. This job
# promotes the tarball release:validate already built and smoke:cpp already
# compiled against; rebuilding here would attach an object no smoke test
# ever exercised.
release:clib:
  stage: release
  <<: *on-release-tag
  needs:
    - job: release:validate
      artifacts: true
    - job: smoke:rust
    - job: smoke:cpp
    - job: smoke:python
    - job: smoke:typescript
  timeout: 10m
  script:
    - cd dist && sha256sum -c pqhybridsign-clib-*.tar.gz.sha256
    - ls -la pqhybridsign-clib-*
  artifacts:
    name: "pqhybridsign-clib-$CI_COMMIT_TAG"
    paths:
      - dist/pqhybridsign-clib-*.tar.gz
      - dist/pqhybridsign-clib-*.tar.gz.sha256
    expire_in: never

release:crates:
  stage: crates
  <<: *on-release-tag
  # Depends on the other registries, not only on the gates. This is the
  # irreversible publish, so it must not run until the reversible ones have
  # succeeded.
  needs:
    - job: release:validate
      artifacts: true
    - job: smoke:rust
    - job: smoke:cpp
    - job: smoke:python
    - job: smoke:typescript
    - job: release:npm
    - job: release:pypi
  environment:
    name: crates-io
    url: https://crates.io/crates/pqhybridsign
  # Trusted publishing, so no long-lived token is stored. The audience must
  # be the literal `crates.io`.
  id_tokens:
    CRATES_IO_ID_TOKEN:
      aud: crates.io
  timeout: 30m
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends jq
  script:
    # Assignment and export are separate statements. `export VAR=$(cmd)`
    # takes its exit status from `export`, which succeeds whatever the
    # command did, so a rejected token exchange would otherwise continue to
    # `cargo publish` with an empty token.
    - CARGO_REGISTRY_TOKEN="$(bash scripts/exchange-crates-token.sh)"
    - export CARGO_REGISTRY_TOKEN
    # Per crate, in dependency order, skipping versions that are already
    # live. cargo hard-fails on an already-published version and has no
    # --skip-existing, and rc1 of all four crates was published by hand to
    # create them for trusted publishing, so the first tag pipeline finds
    # every version already present. The sparse index answers "is this
    # version live" without authentication: all four names share the
    # pq/hy prefix (first two, next two characters of the name).
    - |
      set -euo pipefail
      VERSION="${CI_COMMIT_TAG#v}"
      for crate in pqhybridsign; do
        if curl -fsSL "https://index.crates.io/pq/hy/${crate}" | jq -r '.vers' | grep -qxF "$VERSION"; then
          echo "${crate} ${VERSION} is already on crates.io; skipping."
        else
          cargo publish --locked -p "${crate}"
        fi
      done

# Runs last so the release page appears only once every artifact is live. A
# release pointing at a package that failed to publish is worse than no
# release. Uses the declarative `release:` keyword, so CI_JOB_TOKEN is
# enough and a re-run does not error when the release already exists.
release:notes:
  stage: notes
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  <<: *on-release-tag
  needs:
    - job: release:crates
    - job: release:pypi
    - job: release:npm
    - job: release:clib
      artifacts: true
  timeout: 15m
  before_script: []
  script:
    - echo "Creating the release page for $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "pqhybridsign $CI_COMMIT_TAG"
    description: |
      pqhybridsign $CI_COMMIT_TAG.

      | Artifact | Where |
      | -- | -- |
      | `pqhybridsign` | crates.io |
      | `pqhybridsign` wheel and sdist | PyPI |
      | `@quip.network/pqhybridsign` | npm |
      | `libpqhybridsign_cffi` plus `pqhybridsign.h` | attached below |

      See CHANGELOG.md for the changes in this version, and examples/ for a
      sign/verify roundtrip in Rust, C++, Python, and TypeScript.
    assets:
      links:
        - name: "C library, Linux amd64"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/pqhybridsign-clib-${CI_COMMIT_TAG}-linux-amd64.tar.gz?job=release:clib"
          link_type: package
        - name: "C library checksum"
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/dist/pqhybridsign-clib-${CI_COMMIT_TAG}-linux-amd64.tar.gz.sha256?job=release:clib"
          link_type: other
