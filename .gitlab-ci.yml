stages: [check, test]

default:
  image: rust:1.83
  before_script:
    - rustup component add clippy rustfmt
    - rustup target add wasm32-unknown-unknown

fmt:
  stage: check
  script:
    - cargo fmt --all -- --check

clippy:
  stage: check
  script:
    - cargo clippy --workspace --all-targets -- -D warnings

deps:
  stage: check
  script:
    # All three component crates require rand_core ^0.6. `cargo tree -i`
    # prints one root line per matching version plus indented dependency
    # edges below it, so counting lines that start at column 0 (no leading
    # whitespace) and match "rand_core v" gives the count of distinct
    # versions resolved in the graph, not the count of edges to it.
    - |
      set -euo pipefail
      count=$(cargo tree -i rand_core --workspace | grep -c '^rand_core v')
      if [ "$count" -ne 1 ]; then
        echo "Expected exactly one rand_core major version in the graph, found $count:"
        cargo tree -i rand_core --workspace
        exit 1
      fi

wasm:
  stage: check
  script:
    - cargo build -p pqhybridsign-core --target wasm32-unknown-unknown --no-default-features
    - cargo build -p pqhybridsign-core --target wasm32-unknown-unknown --no-default-features --features alloc
    # The lattice crate must also build without an allocator: it is the
    # crate that pulls in ed25519-zebra, schnorrkel and fips204, any of
    # which could introduce a std or getrandom dependency.
    - cargo build -p pqhybridsign --target wasm32-unknown-unknown --no-default-features

cross-profile:
  stage: check
  script:
    # Exactly one profile-* feature compiles at a time, so no single build can
    # hold a key from another profile and check that it fails. This job
    # supplies the comparison a build cannot: it derives a fingerprint from
    # each profile fixture public key and asserts the fingerprints all differ.
    # A change that stopped binding the profile into the commitment would
    # collide two of them here.
    - |
      set -euo pipefail
      out=$(mktemp)
      for p in profile-256s profile-256s-sha2 profile-128s-q18 profile-128s-q20; do
        cargo test -p pqhybridsign-shrincs --release --no-default-features \
          --features "$p" --test cross_profile -- --nocapture \
          | grep CROSS_PROFILE_FINGERPRINT >> "$out"
      done
      total=$(wc -l < "$out")
      # Compare only the commitment field: the label differs by construction
      # (it carries the profile name), so counting distinct labels would pass
      # even if the commitment stopped depending on the profile.
      distinct=$(sed 's/.*commitment=//' "$out" | sort -u | wc -l)
      cat "$out"
      if [ "$total" -ne 4 ] || [ "$distinct" -ne 4 ]; then
        echo "Expected 4 profiles with 4 distinct commitments, got $total lines and $distinct distinct"
        exit 1
      fi

wasm-npm:
  stage: test
  script:
    # `curl | sh` must fail if curl fails. Without pipefail the installer
    # can run on a truncated script and exit 0.
    - |
      set -euo pipefail
      apt-get update && apt-get install -y --no-install-recommends nodejs
      curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      cd crates/pqhybridsign-wasm
      ./scripts/check-types.sh
      ./scripts/build-npm.sh
      node tests/node/sign_and_verify.mjs

deny:
  stage: check
  script:
    - cargo install cargo-deny --version 0.20.2
    - cargo deny check

doc:
  stage: check
  script:
    - RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

msrv:
  stage: check
  script:
    # `rust-toolchain.toml` pins `stable`, and a toolchain file overrides
    # `rustup default`. Selecting the toolchain any other way leaves this job
    # running on stable and passing whatever the declared floor is, which is a
    # gate that cannot fail. Only the `+toolchain` argument outranks the file.
    - |
      set -euo pipefail
      msrv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
      test -n "$msrv"
      rustup toolchain install "$msrv" --profile minimal
      # Prove the override took effect before trusting the check below.
      cargo "+$msrv" --version
      cargo "+$msrv" check --workspace --all-targets

test-debug:
  stage: test
  script:
    - cargo test --workspace

test-release:
  stage: test
  script:
    # subtle uses debug_assert with secret-dependent branches, so release
    # mode exercises different code than the debug build above.
    - cargo test --workspace --release

# Full suite under each of the four profiles. Proves the tiering holds: a
# test that generates a key under a 128s profile slows this job and is the
# signal that the gate failed.
#
# Clippy runs per profile as well. The `clippy` job above builds default
# features only, so it never sees the code behind the other three
# `profile-*` gates. Tiering put a lot of code behind those gates, and an
# unused import or dead helper there compiles clean everywhere else.
profile-matrix:
  stage: test
  script:
    - |
      set -euo pipefail
      for p in profile-256s profile-256s-sha2 profile-128s-q18 profile-128s-q20; do
        cargo clippy -p pqhybridsign-shrincs --all-targets --no-default-features \
          --features "$p" -- -D warnings
        cargo test -p pqhybridsign-shrincs --release --no-default-features \
          --features "$p"
      done

# Real 128s keygen against the pinned H5 fixture. This is the only real 128s
# operation left per commit: it generates a real key and compares the public
# key against pinned fixture bytes, which covers the 2^18 hypertree root
# derivation. Release is mandatory; debug is roughly 67 times slower.
smoke-128s-q18:
  stage: test
  script:
    - |
      cargo test -p pqhybridsign-shrincs --release --no-default-features \
        --features profile-128s-q18 --test smoke_128s -- --ignored

# Only detector of fixture staleness for the signing paths, and the only
# place the 175-second stateless signing cost still runs. Regenerates every
# profile fixture and fails if any committed file drifted.
regenerate-fixtures:
  stage: test
  timeout: 30m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      set -euo pipefail
      for p in profile-256s profile-256s-sha2 profile-128s-q18 profile-128s-q20; do
        cargo test -p pqhybridsign-shrincs --release --no-default-features \
          --features "$p" --test generate_fixtures -- --ignored --nocapture
      done
      # `git diff` alone would ignore a fixture the generator created rather
      # than overwrote, so an added profile would pass silently. Comparing the
      # whole porcelain status catches modified and untracked files together.
      drift=$(git status --porcelain crates/pqhybridsign-shrincs/tests/vectors/)
      if [ -n "$drift" ]; then
        echo "Fixtures drifted from the committed files:"
        echo "$drift"
        git diff crates/pqhybridsign-shrincs/tests/vectors/
        exit 1
      fi

c-abi:
  stage: test
  script:
    # Builds the cdylib/staticlib, then compiles and links tests/c/main.c
    # against the checked-in header and runs it: proof the header and the
    # library it describes agree, not just that the Rust side compiles.
    - crates/pqhybridsign-cffi/tests/c/run.sh

python:
  stage: test
  script:
    # Builds the pyo3 extension and runs the pytest suite, including the
    # copy, deepcopy and pickle guards on StatefulSecretKey. The C ABI has
    # c-abi and wasm has wasm-npm. This is the matching Python gate.
    - |
      set -euo pipefail
      apt-get update && apt-get install -y --no-install-recommends \
        python3 python3-pip python3-venv python3-dev
      python3 -m venv /tmp/pqhs-py
      . /tmp/pqhs-py/bin/activate
      pip install 'maturin>=1.7,<2.0' pytest
      cd crates/pqhybridsign-py
      maturin develop
      pytest
