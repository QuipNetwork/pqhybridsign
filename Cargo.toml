[workspace]
resolver = "2"
members = [
    "crates/pqhybridsign-core",
    "crates/pqhybridsign",
    "crates/pqhybridsign-shrincs",
    "crates/pqhybridsign-abi",
    "crates/pqhybridsign-wasm",
    "crates/pqhybridsign-py",
    "crates/pqhybridsign-cffi",
]

[workspace.package]
version = "0.0.0-rc1"
edition = "2021"
rust-version = "1.89"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/pqhybridsign"
readme = "README.md"
keywords = ["post-quantum", "signature", "hybrid", "cryptography", "ml-dsa"]
categories = ["cryptography", "no-std"]

[workspace.dependencies]
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
ed25519-zebra = { version = "4.2", default-features = false }
schnorrkel = { version = "0.11.5", default-features = false }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-44"] }
fn-dsa = { version = "0.4.0", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hashsigs-rs = { git = "https://gitlab.com/quip.network/hashsigs-rs.git", rev = "833de08d618b7e42b7991f7c684571133c3d88ab", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev.package."*"]
opt-level = 3

[workspace.lints.rust]
missing-docs           = "deny"
unsafe-code            = "deny"
unused-must-use        = "deny"
unreachable-pub        = "warn"
unused-qualifications  = "warn"

[workspace.lints.clippy]
# Panic prevention. A panic unwinding across `extern "C"` is undefined
# behaviour, and the C ABI's catch_unwind is the only thing standing in
# for these lints today. All four cost nothing: the workspace has zero
# violations of each as of 2026-08-17.
unwrap-used    = "deny"
panic          = "deny"
todo           = "deny"
unimplemented  = "deny"
# One violation, at pqhybridsign-cffi/src/profile.rs:37, carrying a
# targeted allow with the justification that already exists in prose.
expect-used    = "deny"
# 108 violations, every one a slice an upstream length check already
# guards. Denying it would need 108 targeted allows, which trains a
# reader to skip the annotation rather than read it. Recorded decision
# 2026-08-17: leave it off and revisit only if a genuinely unguarded
# slice ever appears.
indexing-slicing = "allow"
allow-attributes = "deny"
