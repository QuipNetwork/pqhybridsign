[workspace]
resolver = "2"
members = [
    "crates/pqhybridsign-core",
    "crates/pqhybridsign",
    "crates/pqhybridsign-shrincs",
    "crates/pqhybridsign-abi",
    "crates/pqhybridsign-wasm",
    "crates/pqhybridsign-py",
    "crates/pqhybridsign-cffi",
]

[workspace.package]
version = "0.0.0-rc1"
edition = "2021"
rust-version = "1.82"
license = "AGPL-3.0-or-later"
repository = "https://gitlab.com/quip.network/pqhybridsign"
readme = "README.md"
keywords = ["post-quantum", "signature", "hybrid", "cryptography", "ml-dsa"]
categories = ["cryptography", "no-std"]

[workspace.dependencies]
subtle = { version = "2.6.1", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["derive"] }
hkdf = { version = "0.12", default-features = false }
sha2 = { version = "0.10.8", default-features = false }
rand_core = { version = "0.6.4", default-features = false }
ed25519-zebra = { version = "4.2", default-features = false }
schnorrkel = { version = "0.11.5", default-features = false }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-44"] }
fn-dsa = { version = "0.4.0", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
hashsigs-rs = { git = "https://gitlab.com/quip.network/hashsigs-rs.git", rev = "833de08d618b7e42b7991f7c684571133c3d88ab", default-features = false, features = ["std"] }
